server {
    # Porta interna fixa do container. A porta publicada no host é definida por
    # PORT no .env (docker-compose: 0.0.0.0:${PORT}:8080), publicada em todas as
    # interfaces para permitir acesso direto por IP:porta.
    # Escuta em 0.0.0.0 para o encaminhamento de porta do Docker alcançar o nginx.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # Bundles com hash do Vite -> cache imutável
    location ~* "^/assets/.+-[A-Za-z0-9_]{8,}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Demais assets do jogo (nomes estáveis) -> cache curto
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # HTML sempre revalida (build novo aparece na hora)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
