services:
  grimfight:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      network: host
    image: nandoburgos/grimfight
    restart: always
    ports:
      # O nginx do container escuta fixo em 8080. A publicação é feita em todas
      # as interfaces (0.0.0.0) para o serviço responder direto em IP:porta, sem
      # exigir proxy reverso; prévias do Opex usam a mesma publicação com outra
      # PORT. PORT é lido do .env.
      - "0.0.0.0:${PORT:?defina PORT no .env}:8080"
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
